name: Knowledge Routing Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run routing mechanics smoke
        run: python skills/marketing-practitioner/scripts/test-knowledge-routing.py
      - name: Validate repository bindings
        run: python skills/marketing-practitioner/scripts/get-knowledge.py --validate
